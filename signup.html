<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenden-signup page</title>
  <link rel="icon" href="./Images/BestSellers_ 1.webp">

  <!-- Tailwind CSS CDN LINK -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" />
 

</head>

<body>
  <!-- signup page -->
  <section class="bg-red-200 flex items-center justify-center min-h-screen">
    <div class="relative w-full max-w-md bg-white shadow-2xl rounded-lg p-8">

      <!-- close (x) Button -->
      <a onclick="history.back()" class="text-4xl cursor-pointer hover:text-green-600 absolute top-4 right-8">&times;</a>

      <!-- Logo -->
      <div class="mb-6">
        <img src="./Images/login.png.jpg" alt="Greenden logo" class="mx-auto w-1/2">
      </div>
      <h2 class="text-xl font-bold text-green-800 text-center">Sign in to your account</h2>
      <form action="#" method="post" class="mt-4">
        <div class="mb-4">
          <label class="block font-medium mb-2">Your email</label>
          <input type="email" placeholder="name@greenden123.com"
            class="px-4 py-2 border w-full rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div class="mb-4">
          <label class="block font-medium mb-2">Password</label>
          <input type="password" placeholder="......"
            class="px-4 py-2 border w-full rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
        </div>

        <div class="flex justify-between items-center mb-4">
          <label class="text-gray-600 flex items-center text-sm">
            <input type="checkbox" class="mr-2">Remember me
          </label>
          <a href="#" class="text-sm text-green-600 hover:underline">Forgot password?</a>
        </div>
        <button class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700" type="submit">
          Sign In
        </button>
      </form>

      <p class="mt-5 text-center text-gray-700 text-sm">Don't have an account? <a href="#"
          class="text-green-600 font-medium hover:underline">sign up</a></p>

    </div>
  </section>

</body>

</html>
